<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIA 창업자 역량진단</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 조판 토큰 — FIA_결과보고서_서식_v1.md §4 */
:root{
  --brand:#A8265A; --brand-d:#6B1739; --brand-l:#FCF3F7;
  --warn:#C05621; --warn-bg:#FDF4EC; --warn-line:#F0D9C4;
  --mid:#B0B8C4; --good:#14795C;
  --ink:#101828; --body:#46525F; --sub:#8A93A0; --ghost:#98A2AE;
  --line:#E4E9F0; --rule:#D9E0E9; --thead:#F6F8FB; --page:#FBFCFD;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Pretendard,-apple-system,system-ui,"Malgun Gothic",sans-serif;font-size:14.5px;
  color:var(--body);background:var(--page);line-height:1.62;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{color:var(--ink);font-weight:700;line-height:1.35}
a{color:var(--brand)}
.wrap{max-width:720px;margin:0 auto;padding:0 24px}
.wide{max-width:1180px;margin:0 auto;padding:0 24px}
.hide{display:none !important}

/* 상단 */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .in{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px}
.logo{font-weight:700;color:var(--ink);font-size:15px;letter-spacing:-.01em}
.logo span{color:var(--brand)}
.top .sp{flex:1}
.org{font-size:12.5px;color:var(--sub)}

/* 진행 */
.steps{display:flex;gap:6px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.steps b{font-weight:500}
.steps .on{color:var(--brand);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 0}
.bar i{display:block;height:100%;background:var(--brand);transition:width .25s}

/* 공통 블록 */
section.scr{padding:36px 0 72px}
.eyebrow{font-size:12.5px;color:var(--brand);font-weight:600;letter-spacing:.02em}
.h-xl{font-size:34px;letter-spacing:-.02em;margin:10px 0 14px}
.h-l{font-size:24px;letter-spacing:-.015em;margin:0 0 10px}
.h-m{font-size:17px;margin:0 0 8px}
.lead{font-size:15px;color:var(--body)}
.muted{color:var(--sub);font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px 22px;margin:14px 0}
.card.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.card.brand{background:var(--brand-l);border-color:#F0D6E2}
.notice{background:var(--brand-l);border:1px solid #F0D6E2;border-radius:7px;
  padding:10px 14px;font-size:12.5px;color:var(--brand-d)}
ul.tight{margin:8px 0 0 18px}
ul.tight li{margin:4px 0;font-size:14px}
.kv{display:flex;gap:10px;font-size:14px;margin:6px 0}
.kv b{min-width:88px;color:var(--ink);font-weight:600}

/* 버튼 */
.btn{appearance:none;border:0;border-radius:5px;background:var(--brand);color:#fff;
  font:600 15px/1 Pretendard,sans-serif;padding:14px 22px;cursor:pointer;letter-spacing:-.01em}
.btn:hover{background:var(--brand-d)}
.btn[disabled]{background:#D6DBE3;color:#fff;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--body);border:1px solid var(--rule)}
.btn.ghost:hover{background:var(--thead)}
.btn.sm{padding:9px 14px;font-size:13.5px}
.row{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.row .sp{flex:1}

/* 입력 */
label.f{display:block;font-size:13px;color:var(--ink);font-weight:600;margin:14px 0 6px}
input[type=text],input[type=password],select{width:100%;padding:12px 13px;border:1px solid var(--rule);border-radius:6px;
  font:400 15px Pretendard,sans-serif;color:var(--ink);background:#fff}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk input{margin-top:4px;width:17px;height:17px;accent-color:var(--brand);flex:none}
.chk .t{font-size:13.5px}
.chk .t b{display:block;color:var(--ink);font-size:14px;margin-bottom:3px}
.req{display:inline-block;background:var(--brand-l);color:var(--brand-d);border-radius:4px;
  font-size:11px;padding:1px 6px;margin-left:6px;vertical-align:2px;font-weight:600}

/* 문항 */
.q{border-top:1px solid var(--line);padding:24px 0}
.q:first-of-type{border-top:0}
.q .no{font-size:12px;color:var(--brand);font-weight:600}
.q .qt{font-size:16px;color:var(--ink);font-weight:600;margin:6px 0 14px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--rule);border-radius:6px;
  padding:12px 14px;cursor:pointer;font-size:14px;background:#fff}
.opt:hover{border-color:var(--brand);background:var(--brand-l)}
.opt input{margin-top:3px;accent-color:var(--brand);flex:none}
.opt.on{border-color:var(--brand);background:var(--brand-l);color:var(--ink)}
.opt.na{border-style:dashed;color:var(--sub)}
.scale5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.scale5 .opt{flex-direction:column;align-items:center;text-align:center;gap:7px;padding:12px 6px;font-size:12.5px}
@media(max-width:640px){.scale5{grid-template-columns:1fr}
  .scale5 .opt{flex-direction:row;align-items:flex-start;text-align:left}}

/* 조건 문항 */
.cond{border:1px solid var(--line);border-radius:8px;background:#fff;padding:20px 22px;margin:16px 0}
.cond h4{font-size:16px;margin-bottom:6px}
.crit{background:var(--thead);border-radius:7px;padding:12px 14px;margin:8px 0;font-size:13px}
.crit b{color:var(--ink)}
.crit ul{margin:6px 0 0 17px}
.crit li{margin:3px 0}
.excl{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:7px;
  padding:12px 14px;font-size:13px;color:var(--warn);margin:10px 0}
table.ex{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
table.ex th,table.ex td{border:1px solid var(--rule);padding:7px 9px;text-align:left;vertical-align:top}
table.ex th{background:var(--thead);color:var(--ink);font-weight:600}

/* 결과 */
.res-head{background:#fff;border-bottom:1px solid var(--line);padding:20px 0 18px}
.score-big{font-size:52px;font-weight:800;color:var(--brand);letter-spacing:-.03em;line-height:1}
.bands{display:flex;gap:8px;margin-top:8px}
.pill{font-size:12px;border-radius:99px;padding:3px 11px;font-weight:600}
.p-w{background:var(--warn-bg);color:var(--warn)}
.p-m{background:#F1F4F8;color:#5B6675}
.p-g{background:#E8F4F0;color:var(--good)}
.grid3{display:grid;grid-template-columns:340px 1fr 300px;gap:22px;align-items:start}
@media(max-width:1080px){.grid3{grid-template-columns:1fr}}
.comp-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.comp-row:first-child{border-top:0}
.comp-row .nm{flex:1;color:var(--ink)}
.comp-row .sc{font-variant-numeric:tabular-nums;color:var(--sub);min-width:34px;text-align:right}
.comp-row.pick{cursor:pointer;margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:6px}
.comp-row.pick:hover{background:var(--brand-l)}
.comp-row.pick.on{background:var(--brand-l);box-shadow:inset 3px 0 0 var(--brand)}
.comp-row.pick.on .nm{color:var(--brand-d);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 0;flex-wrap:wrap}
.tab{padding:10px 14px;font-size:13.5px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.chkitem{display:flex;gap:9px;align-items:flex-start;padding:9px 0;font-size:13.5px;border-top:1px dashed var(--line)}
.chkitem:first-child{border-top:0}
.chkitem input{margin-top:3px;accent-color:var(--brand);flex:none}
.chkitem{cursor:pointer;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:6px}
.chkitem:hover{background:var(--brand-l)}
.chkitem.on{background:var(--brand-l)}
.chkitem.on span{color:var(--ink)}
.chkitem.none span{color:var(--ghost)}
.chkitem:has(input:disabled){cursor:default}
.chkitem:has(input:disabled):hover{background:transparent}
.chkitem.on:has(input:disabled){background:var(--brand-l)}
.cmp{display:grid;grid-template-columns:1fr 42px 18px 42px 150px;gap:8px;align-items:center;
  padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.cmp.head{border-top:0;color:var(--sub);font-size:12px;padding-bottom:4px}
.cmp .nm{color:var(--ink)}
.cmp .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--sub)}
.cmp .v.hi{color:var(--brand);font-weight:700}
.cmp .ar{text-align:center;color:var(--ghost)}
.cmp .note{font-size:12px;color:var(--good)}
.cmp.moved .nm{font-weight:600}
.legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--sub);margin-top:-4px}
.legend i{display:inline-block;width:16px;height:0;vertical-align:middle;margin-right:5px}
.legend i.dash{border-top:2px dashed var(--ghost)}
.legend i.solid{border-top:2px solid var(--brand)}
@media(max-width:900px){.cmp{grid-template-columns:1fr 40px 16px 40px}.cmp .note{display:none}}
.tool{border:1px solid var(--line);border-radius:7px;padding:13px 15px;margin:9px 0;background:#fff}
.tool b{display:block;color:var(--ink);font-size:14px}
.cite{font-size:12px;color:var(--sub);border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.metric{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.metric:first-child{border-top:0}
.metric .v{color:var(--ghost)}
footer{border-top:1px solid var(--line);background:#fff;padding:22px 0;margin-top:40px}
footer .in{max-width:1180px;margin:0 auto;padding:0 24px;font-size:12px;color:var(--sub)}
.stamp{font-size:12px;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line);
  border-radius:7px;padding:8px 13px;display:inline-block}
.err{color:#B42318;font-size:13px;margin-top:8px}

/* 껍데기 — 화면이 바뀌어도 남는다 */
.logo[role=button]:hover{opacity:.72}
.logo[role=button]:focus-visible{outline:2px solid var(--brand);outline-offset:4px;border-radius:4px}
#who{display:flex;align-items:center;gap:9px;font-size:13px}
#who b{cursor:pointer}
#who b:hover{color:var(--brand)}
#who b{color:var(--ink)}
#ctx{border-top:1px solid var(--line);background:var(--thead)}
#ctx .in{max-width:1180px;margin:0 auto;padding:9px 24px;display:flex;
  align-items:center;gap:6px;flex-wrap:wrap}
#ctx:empty{display:none}
.rolechip{font-size:11.5px;border-radius:5px;padding:2px 8px;font-weight:600;
  background:var(--brand-l);color:var(--brand-d)}
.rolechip.adm{background:#0F1B2A;color:#fff}
.lnk{background:none;border:0;font:inherit;color:var(--sub);cursor:pointer;
  padding:4px 8px;border-radius:6px}
.lnk:hover{background:var(--thead);color:var(--ink)}
.runrow{display:flex;align-items:center;gap:14px;padding:13px 0;
  border-top:1px solid var(--line);flex-wrap:wrap}
.runrow:first-of-type{border-top:0}
.runrow .n{font-weight:700;color:var(--ink);min-width:52px}
.runrow .t{font-variant-numeric:tabular-nums;color:var(--brand);font-weight:700;font-size:17px}

/* 대기 표시 — GAS 응답은 수 초 걸린다. 표시가 없으면 멈춘 것으로 보인다. */
#modal{position:fixed;inset:0;z-index:70;display:none;background:rgba(16,24,40,.42);
  overflow-y:auto;padding:28px 16px}
#modal.on{display:block}
#modal .sheet{background:#fff;border-radius:8px;max-width:760px;margin:0 auto;
  padding:26px 30px;box-shadow:0 12px 40px rgba(16,24,40,.18)}
#modal table{width:100%;border-collapse:collapse;font-size:13.5px;margin:12px 0}
#modal th{background:var(--thead);text-align:left;padding:10px 12px;
  border:1px solid var(--rule);font-weight:600;color:var(--ink)}
#modal td{padding:13px 12px;border:1px solid var(--rule);vertical-align:top;height:30px}
#modal .sub{font-size:13px;margin-bottom:14px}
#modal .src{font-size:12px;color:var(--sub);border-top:1px solid var(--line);
  margin-top:18px;padding-top:10px}
#modal .note{background:var(--brand-l);border:1px solid #F0D6E2;border-radius:7px;
  padding:11px 14px;font-size:13px;margin:10px 0}
#busy{position:fixed;left:0;right:0;top:0;z-index:60;display:none}
#busy.on{display:block}
#busy .track{height:3px;background:var(--brand-l);overflow:hidden}
#busy .track i{display:block;height:100%;width:40%;background:var(--brand);
  animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
#busy .msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  background:#fff;border:1px solid var(--line);border-radius:7px;
  padding:16px 22px;font-size:14px;color:var(--ink);
  box-shadow:0 6px 24px rgba(16,24,40,.10);display:flex;gap:11px;align-items:center}
#busy .dot{width:9px;height:9px;border-radius:99px;background:var(--brand);
  animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){
  #busy .track i,#busy .dot{animation:none}
  #busy .track i{width:100%}
}

/* 관리자 대시보드 */
.adm{background:#0F1B2A;color:#C9D3E0}
.adm .in{max-width:1180px;margin:0 auto;padding:9px 24px;display:flex;gap:12px;
  align-items:center;font-size:12.5px}
.adm .in b{color:#fff}
.adm .sp{flex:1}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{background:var(--thead);color:var(--ink);font-weight:600;text-align:left;
  padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.clk{cursor:pointer}
.tbl tr.clk:hover td{background:var(--brand-l)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .none{color:var(--ghost)}
.tbl .sub td{background:#FCFDFE;border-bottom:1px solid var(--line)}
.stat{display:flex;gap:26px;flex-wrap:wrap;margin:4px 0 0}
.stat div{min-width:96px}
.stat .n{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.02em;line-height:1.2}
.tag{font-size:11.5px;border-radius:5px;padding:2px 7px;font-weight:600;
  background:#F1F4F8;color:#5B6675}
.tag.off{background:var(--warn-bg);color:var(--warn)}
.tag.sig{background:var(--warn-bg);color:var(--warn)}
.ansrow{display:grid;grid-template-columns:96px 1fr 200px 62px;gap:12px;font-size:13px;
  padding:10px 0;border-top:1px solid var(--line);align-items:start}
.ansrow:first-child{border-top:0}
.ansrow .id{color:var(--brand);font-weight:600;font-size:12px}
.ansrow .pick{color:var(--ink)}
.ansrow .na{color:var(--warn)}
@media(max-width:900px){
  .ansrow{grid-template-columns:1fr;gap:4px}
  .tbl th:nth-child(n+5),.tbl td:nth-child(n+5){display:none}
}
</style>
</head>
<body>

<div class="top">
  <div class="in">
    <div class="logo" id="goHome" role="button" tabindex="0"
      title="처음으로">FIA <span>창업자 역량진단</span></div>
    <div class="sp"></div>
    <div id="who"></div>
    <div class="org">충북대학교기술지주(주)</div>
  </div>
  <div id="ctx"></div>
</div>

<div id="modal"><div class="sheet"><div id="modalBody"></div></div></div>

<div id="busy"><div class="track"><i></i></div>
  <div class="msg"><span class="dot"></span><span id="busyMsg">접속 중입니다…</span></div></div>

<main id="app"></main>

<footer><div class="in">
  본 진단은 파일럿 운영 중이며 결과는 내부 참고용입니다. ·
  결과는 심사·선정 판단이나 지원 배분의 근거로 사용하지 않습니다.
</div></footer>

<script>
const DATA = {"meta": {"id": "FIA-30", "title": "FIA 창업자 역량 자가진단 (30문항)", "minutes": 20, "count": 30, "watermark": "파일럿·내부 참고용", "gas_url": "https://script.google.com/macros/s/AKfycbza1WoS6xdsEkSRcEWZLcTsRL1sC-CXj5Yx7Q7_uOsyqqyitkfkyagbe8xxbhy6SW6C/exec", "per_page": 5}, "names_ko": {"FM": "창업자 마인드셋", "EC": "실행력", "CU": "고객 이해", "MI": "시장 이해", "PC": "제품 역량", "TC": "기술사업화", "TB": "팀 빌딩", "IR": "투자 준비도", "ST": "전략적 사고", "RI": "지역혁신 연계", "PATH": "성장 경로"}, "items": [{"id": "SEL-FM-01", "comp": "FM", "method": "SEL", "n": 1, "text": "최근 1년간 사업상 심각한 좌절(투자 거절, 핵심 인력 이탈, 계약 파기 등)을 겪은 뒤 1주일 이내에 구체적 대안 행동에 착수한 경험이 얼마나 됩니까?", "scale": "freq5", "options": ["0회", "1–2회", "3–5회", "6–10회", "11회 이상"], "na": "최근 1년간 그런 좌절을 겪은 일이 아직까지 없었습니다"}, {"id": "SEL-EC-01", "comp": "EC", "method": "SEL", "n": 2, "text": "고객·멘토·투자자의 부정적 피드백을 받은 뒤 2주 이내에 제품·전략을 실제로 수정한 적이 얼마나 됩니까?", "scale": "freq5", "options": ["0회", "1–2회", "3–5회", "6–10회", "11회 이상"], "na": "고객·멘토·투자자로부터 그런 부정적 피드백을 받은 일이 아직까지 없었습니다"}, {"id": "SEL-EC-02", "comp": "EC", "method": "SEL", "n": 3, "text": "새 아이디어를 최소기능형태(프로토타입·랜딩페이지·실험)로 세상에 내놓기까지 통상 얼마나 걸립니까?", "scale": "leadtime5", "options": ["6개월 초과", "3–6개월", "1–3개월", "2주–1개월", "2주 이내"]}, {"id": "SEL-CU-01", "comp": "CU", "method": "SEL", "n": 4, "text": "최근 3개월간 제품 개선 목적으로 잠재·기존 고객과 30분 이상 1:1 심층 인터뷰를 진행한 횟수는?", "scale": "freq5", "options": ["0회", "1–2회", "3–5회", "6–10회", "11회 이상"]}, {"id": "SEL-CU-02", "comp": "CU", "method": "SEL", "n": 5, "text": "고객이 제품을 실제로 사용하는 현장을 직접 방문·관찰한 적이 얼마나 됩니까?(최근 6개월)", "scale": "freq5", "options": ["0회", "1–2회", "3–5회", "6–10회", "11회 이상"]}, {"id": "SEL-MI-01", "comp": "MI", "method": "SEL", "n": 6, "text": "최근 6개월간 경쟁사·대체재의 가격·기능·투자 동향을 조사해 기록으로 남긴 횟수는?", "scale": "freq5", "options": ["0회", "1–2회", "3–5회", "6–10회", "11회 이상"]}, {"id": "SEL-PC-01", "comp": "PC", "method": "SEL", "n": 7, "text": "최근 6개월간 기능을 추가하기 전에 가설을 문서로 정의하고 실험으로 확인한 횟수는?", "scale": "freq5", "options": ["0회", "1–2회", "3–5회", "6–10회", "11회 이상"], "na": "최근 6개월간 제품에 기능을 추가한 일이 아직까지 없었습니다"}, {"id": "SEL-PC-02", "comp": "PC", "method": "SEL", "n": 8, "text": "최근 6개월간 제품·서비스 버전을 반복 개선(iteration)한 횟수는?", "scale": "freq5", "options": ["0회", "1–2회", "3–5회", "6–10회", "11회 이상"]}, {"id": "SEL-TC-01", "comp": "TC", "method": "SEL", "n": 9, "text": "핵심 기술에 대해 특허 출원·영업비밀 관리 등 방어 조치를 실제로 취했다.", "scale": "likert5", "options": ["전혀 아니다", "아니다", "보통", "그렇다", "매우 그렇다"]}, {"id": "SEL-TC-02", "comp": "TC", "method": "SEL", "n": 10, "text": "기술을 비전문가(투자자·고객)에게 설명하기 위한 별도 자료를 준비해 둔다.", "scale": "likert5", "options": ["전혀 아니다", "아니다", "보통", "그렇다", "매우 그렇다"]}, {"id": "SEL-TB-01", "comp": "TB", "method": "SEL", "n": 11, "text": "핵심 인재 영입 시 명확한 역량·컬처핏 기준을 문서화해 활용한다.", "scale": "likert5", "options": ["전혀 아니다", "아니다", "보통", "그렇다", "매우 그렇다"], "na": "핵심 인재를 영입한 일이 아직까지 없었습니다"}, {"id": "SEL-IR-01", "comp": "IR", "method": "SEL", "n": 12, "text": "최근 6개월간 번레이트(월 현금 소진액)와 잔여 런웨이를 계산해 기록으로 남긴 횟수는?", "scale": "freq5", "options": ["0회", "1–2회", "3–5회", "6–10회", "11회 이상"]}, {"id": "SEL-ST-01", "comp": "ST", "method": "SEL", "n": 13, "text": "최근 3개월간 중요한 의사결정에서 2개 이상의 대안을 문서로 비교한 횟수는?", "scale": "freq5", "options": ["0회", "1–2회", "3–5회", "6–10회", "11회 이상"], "na": "최근 3개월간 그만한 무게의 의사결정이 아직까지 없었습니다"}, {"id": "SJT-FM-01", "comp": "FM", "method": "SJT", "n": 14, "text": "자금난으로 이번 달 팀 급여의 일부만 지급 가능합니다. 가장 적절한 대응은?", "options": [{"key": "A", "text": "아무에게도 알리지 않고 대표 급여만 삭감해 메운다"}, {"key": "B", "text": "지급 지연 사실과 사유·일정을 사전에 고지하고, 법이 정한 절차와 동의 요건을 확인한 뒤 현금 보전 대안을 함께 제시한다"}, {"key": "C", "text": "대출로 전액 지급하고 위기 상황은 알리지 않는다"}, {"key": "D", "text": "무급을 통보하고 각자 판단에 맡긴다"}]}, {"id": "SJT-EC-01", "comp": "EC", "method": "SJT", "n": 15, "text": "3개 스프린트 연속으로 계획한 목표의 절반만 완료되고 있습니다. 팀원들은 각자 바쁘다고 말합니다. 가장 적절한 대응은?", "options": [{"key": "A", "text": "달성 가능한 수준으로 목표치를 낮춘다"}, {"key": "B", "text": "미완료 항목의 지연 원인을 유형별로 분류해 병목을 특정하고, 다음 스프린트에서 그 원인 하나만 제거하는 실험을 한다"}, {"key": "C", "text": "인력을 충원한다"}, {"key": "D", "text": "개인별 완료율을 공개해 경쟁을 유도한다"}]}, {"id": "SJT-CU-02", "comp": "CU", "method": "SJT", "n": 16, "text": "초기 유료고객 1곳이 큰 금액을 제시하며 자사 전용 커스터마이징을 요구합니다. 제품 로드맵과는 어긋납니다. 가장 적절한 대응은?", "options": [{"key": "A", "text": "매출을 위해 요구를 전면 수용한다"}, {"key": "B", "text": "로드맵 정합성과 기회비용을 산정한 뒤 공용화 가능한 범위만 반영하고, 나머지는 유상 별도 계약으로 분리한다"}, {"key": "C", "text": "제품 원칙을 지키기 위해 전면 거절한다"}, {"key": "D", "text": "전담 SI 조직을 신설해 수주한다"}]}, {"id": "SJT-MI-02", "comp": "MI", "method": "SJT", "n": 17, "text": "경쟁사가 우리 제품이 자사 특허를 침해했다고 주장하는 내용증명을 보냈습니다. 가장 적절한 대응은?", "options": [{"key": "A", "text": "무시하고 사업을 계속한다"}, {"key": "B", "text": "관련 자료를 보전한 뒤 전문가 검토로 침해 여부를 확인하고, 회피설계·라이선스·대응을 사업 연속성 기준으로 결정한다"}, {"key": "C", "text": "즉시 해당 기능을 삭제한다"}, {"key": "D", "text": "맞소송으로 대응한다"}]}, {"id": "SJT-TC-01", "comp": "TC", "method": "SJT", "n": 18, "text": "실험실에서 검증한 성능이 양산 공정에서는 재현되지 않아 수율이 목표의 절반입니다. 고객사 납품 일정은 두 달 남았습니다. 가장 적절한 대응은?", "options": [{"key": "A", "text": "현재 수율로 납품하고 개선은 이후에 진행한다"}, {"key": "B", "text": "수율 저하의 지배 인자를 공정 변수별로 분리 검증하고, 고객사에 사양·일정 조정안을 근거와 함께 제시한다"}, {"key": "C", "text": "납기를 맞추기 위해 사양을 낮춰 재협상한다"}, {"key": "D", "text": "외부 위탁생산으로 전환한다"}]}, {"id": "SJT-TB-01", "comp": "TB", "method": "SJT", "n": 19, "text": "공동창업자가 개인 사정으로 근로 시간을 절반으로 줄이겠다고 통보했습니다. 지분은 5:5입니다. 가장 적절한 대응은?", "options": [{"key": "A", "text": "동등 지분을 그대로 유지한다"}, {"key": "B", "text": "기여도 변화와 지분·베스팅 조정을 당사자와 협의하고, 법률 자문을 거쳐 문서화한다"}, {"key": "C", "text": "즉시 퇴사를 권고한다"}, {"key": "D", "text": "대표자가 업무 가중을 감수하고 넘어간다"}]}, {"id": "SJT-IR-01", "comp": "IR", "method": "SJT", "n": 20, "text": "예상보다 30% 낮은 밸류의 텀시트를 받았습니다. 런웨이는 5개월 남았습니다. 가장 적절한 대응은?", "options": [{"key": "A", "text": "조건을 받아들일 수 없어 거절하고 더 좋은 조건을 기다린다"}, {"key": "B", "text": "희석 영향·마일스톤·부수 조항 전체를 계산해 협상하되, 대안 자금원을 병행 타진한다"}, {"key": "C", "text": "즉시 무조건 수용한다"}, {"key": "D", "text": "브릿지론으로만 버틴다"}]}, {"id": "SJT-IR-02", "comp": "IR", "method": "SJT", "n": 21, "text": "핵심 투자자가 '공동창업자 중 1인을 교체해야 투자하겠다'는 조건을 제시했습니다. 가장 적절한 대응은?", "options": [{"key": "A", "text": "투자를 위해 즉시 교체를 통보한다"}, {"key": "B", "text": "지적된 문제의 사실 여부를 먼저 검증하고, 당사자 협의와 이사회 절차를 거쳐 결정한다"}, {"key": "C", "text": "조건을 거절하고 투자를 포기한다"}, {"key": "D", "text": "투자자에게 알리지 않고 해당 창업자를 실무에서 배제한다"}]}, {"id": "SJT-ST-01", "comp": "ST", "method": "SJT", "n": 22, "text": "런웨이가 3개월 남았고, 제품 출시는 연기되었으며 브릿지 투자가 전면 거절되었습니다. 가장 적절한 첫 조치는?", "options": [{"key": "A", "text": "미완성 제품을 즉시 출시한다"}, {"key": "B", "text": "현금 소진 시점을 다시 산정해 이해관계자에게 고지하고, 법이 정한 절차 안에서 비용 구조 조정안을 마련한다"}, {"key": "C", "text": "브릿지론을 타진한다"}, {"key": "D", "text": "외주 용역 수주로 현금을 확보한다"}]}, {"id": "SJT-CU-01", "comp": "CU", "method": "SJT", "n": 23, "text": "핵심 고객군이 설문에서 'A 기능이 꼭 필요하다'고 답했으나, 실제 사용 로그에서는 아무도 A를 쓰지 않습니다. 가장 적절한 대응은?", "options": [{"key": "A", "text": "설문 응답대로 A 기능을 고도화한다"}, {"key": "B", "text": "사용 로그를 우선 근거로 삼고, 소수 심층 인터뷰로 불일치 원인을 규명한다"}, {"key": "C", "text": "설문 응답자 중 실제 사용자를 식별해 재확인하고, 질문 설계를 고쳐 다시 조사한다"}, {"key": "D", "text": "판단을 유보하고 매출에 직결되는 다른 기능에 집중한다"}]}, {"id": "SJT-CU-03", "comp": "PC", "method": "SJT", "n": 24, "text": "가입자는 늘지만 4주 리텐션이 15%로 낮고, 대신 10%의 열성 사용자가 매일 접속합니다. 가장 적절한 우선순위는?", "options": [{"key": "A", "text": "신규 유입 마케팅을 확대한다"}, {"key": "B", "text": "열성 사용자군을 세분해 공통 사용맥락을 분석하고 핵심가치를 재정의한다"}, {"key": "C", "text": "리텐션이 낮으므로 피벗한다"}, {"key": "D", "text": "이탈 코호트와 잔존 코호트의 차이를 먼저 측정해 판단 근거를 확보한다"}]}, {"id": "SJT-MI-01", "comp": "MI", "method": "SJT", "n": 25, "text": "대기업이 우리와 유사한 기능을 무료로 번들 출시했습니다. 가장 적절한 대응은?", "options": [{"key": "A", "text": "즉시 가격을 인하해 맞대응한다"}, {"key": "B", "text": "대기업이 진입하지 않는 좁은 시장·심층 가치로 재포지셔닝한다"}, {"key": "C", "text": "해당 시장을 포기하고 인접한 문제 영역으로 전환한다"}, {"key": "D", "text": "기능을 추가해 경쟁한다"}]}, {"id": "SJT-ST-03", "comp": "ST", "method": "SJT", "n": 26, "text": "경쟁사가 대규모 투자를 유치해 공격적 마케팅으로 시장을 잠식 중입니다. 가장 적절한 대응은?", "options": [{"key": "A", "text": "자금을 추가 조달해 마케팅으로 맞대응한다"}, {"key": "B", "text": "방어 가능한 핵심 세그먼트에 자원을 집중하고 해자를 강화한다"}, {"key": "C", "text": "관망한다"}, {"key": "D", "text": "즉시 매각을 추진한다"}]}, {"id": "PATH-01", "comp": "PATH", "method": "SEL", "n": 27, "text": "앞으로 1~2년, 귀사의 성장을 어느 쪽으로 끌고 가실 계획입니까?", "scale": "path3", "options": ["투자주도 — 외부투자를 받아 인재와 개발에 먼저 투입하고 시장을 선점한다", "매출주도 — 고객과 초기 매출로 검증한 뒤 그 현금으로 확장한다", "기술사업화 — 연구개발과 특허를 먼저 쌓고 기술이전·공동개발로 진입한다"], "keys": ["A", "B", "C"]}, {"id": "SEL-FM-04", "comp": "FM", "method": "SEL", "n": 28, "text": "나는 창업을 결심한 이후 자금·팀 문제로 단 한 번도 심각한 스트레스나 두려움을 느낀 적이 없다.", "scale": "likert5", "options": ["전혀 아니다", "아니다", "보통", "그렇다", "매우 그렇다"]}, {"id": "SEL-CU-04", "comp": "CU", "method": "SEL", "n": 29, "text": "우리 제품은 충분히 좋기 때문에 고객 인터뷰를 자주 할 필요가 없다.", "scale": "likert5", "options": ["전혀 아니다", "아니다", "보통", "그렇다", "매우 그렇다"]}, {"id": "SEL-RI-01", "comp": "RI", "method": "SEL", "n": 30, "text": "충북 전략산업(반도체·이차전지·바이오·AI·모빌리티·양자) 클러스터와의 협력 계획·경험이 있다.", "scale": "likert5", "options": ["전혀 아니다", "아니다", "보통", "그렇다", "매우 그렇다"]}], "conditions": [{"id": "COND-TECH-01", "title": "기술 진입장벽 유형", "question": "귀사의 제품·서비스는 고객에게 판매되기까지 어떤 검증을 거칩니까?", "lead": "아래 기준을 먼저 읽고 고르십시오. 어느 쪽이 우월하다는 뜻이 아니라, 경쟁 상황에서 취할 수 있는 대응이 달라지기 때문에 묻는 것입니다.", "groups": [{"key": "defensible_by_technology", "label": "기술 검증형 — 판매 전에 인증·허가나 임상, 또는 수요처의 자체 검증을 거쳐야 합니다", "criteria": ["판매 전에 법으로 정해진 인증·허가를 받아야 한다 (식약처 품목허가·GMP·KC·KS·환경인증 등)", "안전성·유효성을 임상 또는 비임상 시험으로 입증해야 한다", "수요처가 도입 전에 자체 검증(PoC·퀄테스트·실증)을 요구하고, 그 기간이 3개월 이상이다", "실험실에서 낸 성능을 양산에서 재현하려면 별도의 공정 개발이 필요하다", "핵심 기능이 특허나 표준으로 보호되어 우회설계에 상당한 비용과 기간이 든다"], "rule": "위 다섯 가운데 **하나라도 해당하면** 이쪽입니다."}, {"key": "feature_substitutable", "label": "기능 대체형 — 별도 인증이나 고객사 검증 없이 바로 쓸 수 있습니다", "criteria": ["고객이 가입·구매 직후 바로 사용한다", "규제나 인증이 없거나 형식적인 절차에 그친다", "경쟁 제품이 같은 기능을 3~6개월 안에 붙일 수 있다", "고객이 지금 쓰는 대체 수단이 이미 여럿 있다 (엑셀·수기·다른 앱 등)"], "rule": "위 기준에 주로 해당하면 이쪽입니다."}], "exclusions": {"title": "진입장벽으로 세지 않는 것", "note": "**돈이 많이 든다고 기술 진입장벽이 아닙니다. 기술을 검증받는 데 드는 비용만 해당합니다.** 아래는 자본력이나 사업 규모의 문제이지 기술 장벽이 아닙니다.", "items": ["마케팅·광고 비용", "초기 사용자·가입자 확보 비용", "브랜드 인지도", "개발 인건비 자체", "영업 조직 구축 비용"]}, "examples": [{"업종": "바이오·제약", "판정": "defensible_by_technology", "이유": "비임상·임상으로 안전성과 유효성을 입증해야 하며 여기에 수년과 상당한 비용이 든다. 이 비용은 기술 검증에 직접 쓰이므로 진입장벽으로 본다. **판매 이후의 마케팅 비용은 제외한다.**"}, {"업종": "의료기기", "판정": "defensible_by_technology", "이유": "식약처 품목허가와 GMP 인증을 통과해야 판매할 수 있다."}, {"업종": "반도체 소부장", "판정": "defensible_by_technology", "이유": "수요처(소자·장비사)의 퀄테스트가 통상 6~18개월 걸리고, 통과 전에는 납품이 불가하다."}, {"업종": "이차전지 소재", "판정": "defensible_by_technology", "이유": "셀 메이커의 평가 절차를 거쳐야 하며 공정 재현성 확보에 별도 개발이 든다."}, {"업종": "공공 실증형 기술(환경·에너지·안전)", "판정": "defensible_by_technology", "이유": "실증 사업과 성능 인증을 거쳐야 조달·납품이 열린다."}, {"업종": "일반 B2C 앱·커머스", "판정": "feature_substitutable", "이유": "인증 절차가 없고 사용자가 내려받아 바로 쓴다. 대체 수단도 여럿이다."}, {"업종": "일반 업무용 B2B SaaS", "판정": "feature_substitutable", "이유": "도입 검증이 짧고, 같은 기능을 제공하는 대체 서비스가 이미 있다."}, {"업종": "AI 서비스", "판정": "갈린다 — 기준으로 판단할 것", "이유": "의료 AI·금융 AI는 인허가와 감독 규제가 걸려 기술 검증형이고, 일반 생산성 도구는 기능 대체형이다. **업종 이름이 아니라 위 기준으로 고르십시오.**"}], "note": ""}, {"id": "COND-LOG-01", "title": "고객 행동 데이터 축적 여부", "question": "고객이 제품을 쓰는 과정이 데이터로 쌓입니까?", "lead": "고객의 말과 실제 행동이 어긋날 때, 무엇을 먼저 근거로 삼을지가 달라지기 때문에 묻습니다.", "groups": [{"key": "behavioral_log_available", "label": "쌓입니다 — 사용 기록이 자동으로 남아 언제 무엇을 했는지 확인할 수 있습니다", "criteria": ["제품이 소프트웨어·앱·웹이고 사용자 행동이 자동으로 기록된다", "고객이 주 1회 이상 반복해서 사용한다", "이탈·재방문·기능별 사용 여부를 지금 조회할 수 있다"], "rule": ""}, {"key": "low_frequency_b2b", "label": "쌓이지 않습니다 — 구매·사용이 드물거나 오프라인이라 과정을 데이터로 볼 수 없습니다", "criteria": ["고객이 연 1~2회 구매한다 (장비·원료·수주형 납품)", "오프라인 대면으로 제공되어 사용 과정이 기록되지 않는다", "사용자와 구매 결정자가 달라 실제 사용 양상을 알기 어렵다"], "rule": ""}], "exclusions": null, "examples": [{"업종": "B2C 앱·구독형 서비스", "판정": "behavioral_log_available", "이유": "접속·기능 사용이 자동 기록되고 반복 사용된다."}, {"업종": "업무용 SaaS", "판정": "behavioral_log_available", "이유": "계정별 사용 로그가 남는다. 다만 구매 결정자와 사용자가 다르면 해석에 주의가 필요하다."}, {"업종": "산업 장비·소재 납품", "판정": "low_frequency_b2b", "이유": "구매 주기가 길고 사용은 고객사 공정 안에서 일어나 기록이 우리에게 오지 않는다."}, {"업종": "바이오·제약", "판정": "low_frequency_b2b", "이유": "처방·투여 기록은 의료기관에 남고 기업이 직접 조회할 수 없다."}, {"업종": "오프라인 서비스·시공", "판정": "low_frequency_b2b", "이유": "대면 제공이라 사용 과정이 데이터로 남지 않는다."}], "note": ""}, {"id": "COND-STAGE-01", "title": "유료 매출 발생 여부", "question": "지금까지 고객에게 대가를 받고 제품·서비스를 지가 실습이다.", "**1단계 — 뼈대 만들기(사전 조사).** 창업 아이템이 속한 산업에서 원재료·부품(후방)부터 최종 제품 생산과 최종 고객(전방)까지의 생산·공급 흐름을 자료 기반으로 그린다. 각 단계의 주요 사업자와 우리 팀의 위치를 표시한다. 국내 산업별 지도는 이래학(2026, 『2026~2027 대한민국 산업지도』)이 실물 참고서로 유용하다. 이 생산관리 정보의 뼈대가 서야 다음 단계가 가능하다.", "**2단계 — 핵심 부품과 관리 대상의 구분.** 그린 부품·공급 단계 중, 기술적 우위 또는 가격경쟁력이라는 선택 기준에 걸리는 핵심 부품이 무엇인지 표시한다. 그 밖의 대부분은 구매력을 높이기 위한 공급자 관리의 대상이다 — §4.8에서 배운 포터의 교섭력 문제가 실물로 나타나는 지점이며, 공급자 관리는 특별한 일이 아니라 비즈니스의 기본 업무다.", "**3단계 — 집중 영역 도출.** 완성된 뼈대 위에서 두 질문에 답한다.", "1. 이 산업에서 마진을 결정하는 요인은 무엇인가(원재료가, 환율, 경쟁 구조, 규제 등) — 업종별 수익성 결정요인 분석 틀(이민주, 2010, 『대한민국 산업분석』) 참조.", "2. 고객 가치와 만족이 만들어지는 지점은 어디이며, 우리 내부 역량 중 어디에 집중해야 하는가(R&D, 가격, 유통, 마케팅, 고객관리) — 부가가치의 위치는 스마일커브 개념(박승록, 2023, 『글로벌 가치사슬의 경제학』) 참조.", "3단계의 답은 린 캔버스(워크시트 4-1)의 채널·고객관계·경쟁우위 칸으로 되돌아간다. 지도는 그리는 것이 목적이 아니라, 그 위에서 고객과 어떤 관계를 만들지와 무엇에 집중할지를 도출하는 것이 목적이다."], "source": "저자 작성(인용 문헌 기반 재구성)", "notes": []}, "워크시트 4-2": {"ref": "워크시트 4-2", "title": "거점시장 선정", "time": "팀 20분", "chapter": "04_비즈니스모델과_전략", "lead": "후보 시장 3개를 놓고 채점한다(각 1~5점).", "table": {"head": ["기준", "후보 A", "후보 B", "후보 C"], "rows": [["고객끼리 입소문을 주고받는 동질 집단인가", "", "", ""], ["우리 자원으로 1위가 될 수 있는 크기인가", "", "", ""], ["이긴 뒤 건너갈 인접 시장이 있는가", "", "", ""], ["지불 의사를 이미 확인했는가 (3장 데이터)", "", "", ""], ["합계", "", "", ""]]}, "paras": [], "source": "Aulet(2013) 재구성", "notes": []}, "워크시트 8-6": {"ref": "워크시트 8-6", "title": "위기 커뮤니케이션 계획", "time": "팀 20분", "chapter": "08_위기전환과_의사결정", "lead": "", "table": {"head": ["대상", "언제 알리는가", "사실", "조치", "요청"], "rows": [["팀 내부", "", "", "", ""], ["고객·사용자", "", "", "", ""], ["투자자·지원기관", "", "", "", ""], ["학교·지도교수", "", "", "", ""]]}, "paras": [], "source": "저자 작성", "notes": ["위기가 오기 전에 채운다. 위기 발생 후 계획을 수립하면 정보 공개가 지연될 수 있으므로 대상별 공유 기준을 사전에 정할 필요가 있다."]}, "워크시트 5-1": {"ref": "워크시트 5-1", "title": "AARRR 퍼널 설계", "time": "팀 30분", "chapter": "05_마케팅_브랜드_세일즈", "lead": "", "table": {"head": ["단계", "우리 서비스에서의 정의", "측정 지표", "현재 값(모르면 \"?\")", "개선 아이디어"], "rows": [["획득", "", "", "", ""], ["활성화", "", "", "", ""], ["유지", "", "", "" /* 대기 표시 — 서버를 부르는 모든 자리에 건다.
   🔴 GAS 는 응답에 수 초가 걸린다. 표시가 없으면 눌러도 아무 일이 없는 것처럼 보여
      「접속이 안 된다」고 읽힌다. 실제로 그렇게 보고되었다(2026-08-01). */
let busyN = 0;
function busy(on, msg){
  busyN = Math.max(0, busyN + (on ? 1 : -1));
  const b = document.querySelector('#busy'), m = document.querySelector('#busyMsg');
  if(!b) return;
  if(msg && m) m.textContent = msg;
  b.classList.toggle('on', busyN > 0);
}
const isAdmin = () => S.role === 'admin';
const RES = () => (V.view && V.view.result) || S.result;

/* 🔴 대응 선택의 출처가 역할에 따라 다르다.
   기업 = 이 브라우저의 S.plan(고치는 중) · 관리자 = 서버가 준 기업의 저장분(읽기 전용).
   관리자가 자기 로컬 선택을 보면 늘 빈 화면이 된다. */
function planNow(){
  if(!isAdmin()) return S.plan;
  const p = (V.view && V.view.plan) || {};
  const out = {};
  Object.keys(p).forEach(k => {
    const c = p[k] && p[k].choice;
    out[k] = (c === '' || c == null) ? null : Number(c);
  });
  return out;
}
const planRO = () => isAdmin();      // 관리자는 고칠 수 없다

/* 로그아웃 = 이 브라우저에서 지우기. 초기화 버튼과 하는 일이 같아 하나로 합쳤다. */
function logout(force){
  const n = answered();
  if(!force && n && !confirm(
      `응답한 ${n}문항이 이 브라우저에서 지워집니다.\n`
      + `제출을 마친 회차는 서버에 남아 있어 언제든 다시 보실 수 있습니다.\n\n나가시겠습니까?`))
    return;
  localStorage.removeItem(KEY);
  S = Object.assign({}, BLANK);
  V.list = null; V.open = ''; V.view = null; V.myRuns = null;
  go('landing');
}

      <ul style="margin:6px 0 0 17px">${c.exclusions.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}

function qHTML(it){
  const cur = S.ans[it.id];
  const sel = it.method === 'SEL';
  const opts = sel
    ? `<div class="scale5">${it.options.map((t,i)=>optHTML(it.id, String(i+1), t, cur)).join('')}</div>`
    : `<div class="opts">${it.options.map(o=>optHTML(it.id, o.key, o.text, cur)).join('')}</div>`;
  const na = it.na ? `<div class="opts" style="margin-top:8px">
      ${optHTML(it.id, DATA.na_key, it.na, cur, 'na')}</div>` : '';
  return `<div class="q" data-q="${esc(it.id)}">
    <div class="no">${it.n}. ${esc(DATA.names_ko[it.comp]||it.comp)}</div>
    <div class="qt">${esc(it.text)}</div>${opts}${na}</div>`;
}
function optHTML(qid, val, text, cur, cls){
  return `<label class="opt ${cls||''} ${cur===val?'on':''}">
    <input type="radio" name="${esc(qid)}" value="${esc(val)}" ${cur===val?'checked':''}>
    <span>${esc(text)}</span></label>`;
}

    <div id="paneMain"></div>
    <div id="paneSide"></div>
  </div></div></section>`;
};

function radar(cs){
  const list = cs.filter(c => c.score != null && c.code !== 'RI');
  const n = list.length, cx=160, cy=150, rr=110;
  const pt = (i, v) => { const a = -Math.PI/2 + i*2*Math.PI/n, r = rr*Math.max(.08, v/100);
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; };
  const web = [25,50,75,100].map(v => `<polygon points="${list.map((_,i)=>pt(i,v).join(',')).join(' ')}"
    fill="none" stroke="var(--line)" stroke-width="1"/>`).join('');
  const poly = `<polygon points="${list.map((c,i)=>pt(i,c.score).join(',')).join(' ')}"
    fill="rgba(168,38,90,.14)" stroke="var(--brand)" stroke-width="2"/>`;
  const labels = list.map((c,i)=>{ const [x,y]=pt(i,118);
    return `<text x="${x}" y="${y}" font-size="10.5" fill="var(--sub)" text-anchor="middle"
      dominant-baseline="middle">${esc(c.name)}</text>`; }).join('');
  return `<svg viewBox="0 0 320 300" style="width:100%;height:auto">${web}${poly}${labels}</svg>`;
}

/* ══════════════ 대응 계획 — Before / After ══════════════
   설계정본 docs\설계정본_대응계획_v1.md §3-3

   🔴 「예측」이라 쓰지 않는다. 근거가 없다. 가정에 따른 산술일 뿐이다.
   🔴 구간 이동을 단정하지 않는다 — 경계가 잠정값이다. 「닿습니다」로 적는다.
   🔴 표는 10영역(RI 포함·미산입 표기) · 그래프는 9영역(RI 제외). */
function panePlan(main, side, r){
  const PL = planNow();
  const picked = Object.keys(PL).filter(k => PL[k] !== null && PL[k] !== undefined);
  const run = (r.meta && r.meta.run) || 0;

  if(!picked.length){
    main.innerHTML = isAdmin()
      ? `<div class="card"><h3 class="h-m">이 기업이 고른 대응이 없습니다</h3>
         <p class="lead">기업이 결과 화면의 「보완 과제」에서 대응을 고르고
           「이 계획 저장」을 누르면 여기에 나옵니다.</p></div>`
      : `<div class="card"><h3 class="h-m">아직 고르신 대응이 없습니다</h3>
         <p class="lead">「보완 과제」 탭에서 문항마다 하나씩 고르시면,
           그 선택을 반영했을 때 영역별 위치가 어떻게 달라지는지 여기에 나옵니다.</p>
         <div class="row"><button class="btn" id="toTask">보완 과제로</button></div></div>`;
    side.innerHTML = ''; return;
  }

  const key = run + ':' + picked.sort().join(',');
  if(!V.sim || V.simFor !== key){
    main.innerHTML = `<div class="card"><p class="lead">계산 중입니다.</p></div>`;
    side.innerHTML = '';
    if(LOCAL){ V.sim = null; V.simFor = key;
      main.innerHTML = `<div class="card"><h3 class="h-m">로컬 검수 모드</h3>
        <p class="lead">채점키가 서버에만 있어 여기서는 산술을 하지 않습니다.</p></div>`;
      return; }
    busy(true, '고르신 대응을 반영해 계산하는 중입니다…');
    const picks = {}; picked.forEach(k => picks[k] = PL[k]);
    api('simulate', {token:S.token, run, cid:(r.meta||{}).cid, picks}).then(x => {
      busy(false);
      if(!x || !x.ok){ main.innerHTML = `<div class="card">
        <h3 class="h-m">계산하지 못했습니다</h3>
        <p class="lead">${esc(apiErrText(x && x.error))}</p></div>`; return; }
      V.sim = x; V.simFor = key; tab('plan');
    }).catch(() => { busy(false);
      main.innerHTML = `<div class="card"><p class="err">서버에 닿지 못했습니다.</p></div>`; });
    return;
  }

  const sim = V.sim;
  const B = {}, A = {};
  (sim.before.competencies||[]).forEach(c => B[c.code] = c);
  (sim.after.competencies||[]).forEach(c => A[c.code] = c);
  const codes = (sim.before.competencies||[]).map(c => c.code);

  const rows = codes.map(code => {
    const b = B[code] || {}, a = A[code] || {};
    if(b.score == null) return `<div class="cmp">
      <span class="nm">${esc(b.name||code)}</span>
      <span class="v">—</span><span class="ar"></span><span class="v">—</span>
      <span class="note">총점 미산입</span></div>`;
    const up = (a.score||0) - (b.score||0);
    return `<div class="cmp${up>0?' moved':''}">
      <span class="nm">${esc(b.name||code)}</span>
      <span class="v">${b.score}</span>
      <span class="ar">${up>0?'→':''}</span>
      <span class="v ${up>0?'hi':''}">${up>0?a.score:''}</span>
      <span class="note">${up>0
        ? (a.band !== b.band ? `${esc(a.band)} 구간에 닿습니다` : `+${up}`)
        : '<span class="muted">고른 대응 없음</span>'}</span></div>`;
  }).join('');

  const tb = sim.before.total, ta = sim.after.total;
  main.innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap">
        <div><div class="muted">고르신 대응</div>
          <div class="score-big" style="font-size:34px">${sim.applied}건</div></div>
        <div class="sp" style="flex:1"></div>
        <div style="text-align:right"><div class="muted">종합점수</div>
          <div style="display:flex;align-items:baseline;gap:10px;justify-content:flex-end">
            <span style="font-size:26px;color:var(--sub)">${tb == null ? '—' : tb}</span>
            <span style="color:var(--sub)">→</span>
            <span class="score-big" style="font-size:34px">${ta == null ? '—' : ta}</span></div></div>
      </div>
      ${dualRadar(sim.before.competencies, sim.after.competencies)}
      <div class="cmp head"><span class="nm">영역</span><span class="v">지금</span>
        <span class="ar"></span><span class="v">반영 후</span><span class="note"></span></div>
      ${rows}
    </div>
    <div class="card warn">
      <p style="font-size:13.5px;margin:0">이 수치는 고르신 대응이 해당 문항을
        <b style="color:var(--ink)">한 단계 올렸다고 볼 때의 산술</b>입니다.
        실제 변화를 예측한 값이 아닙니다.</p>
      <p style="font-size:13.5px;margin:8px 0 0">구간 경계는 응답 표본이 300건에 이르기 전까지
        잠정값입니다. 구간이 바뀐다고 나와도 그 경계 자체가 아직 확정된 것이 아닙니다.</p>
    </div>`;

  const skip = sim.skipped || [];
  side.innerHTML = `
    <div class="card"><h3 class="h-m">반영 내역</h3>
      <div class="kv"><b>고른 것</b><span>${sim.picked}건</span></div>
      <div class="kv"><b>반영됨</b><span>${sim.applied}건</span></div>
      ${skip.length ? `<div class="kv"><b>제외됨</b><span>${skip.length}건</span></div>
        <p class="muted" style="margin-top:8px">${skip.map(s =>
          s.why === 'na' ? `${esc(s.item)} — 「아직까지 없었습니다」로 답하신 문항입니다. 결측이라 올리지 않습니다.`
          : s.why === 'top' ? `${esc(s.item)} — 이미 가장 높은 선택입니다.`
          : `${esc(s.item)} — 알 수 없는 문항입니다.`).join('<br>')}</p>` : ''}
      ${isAdmin() ? '<p class="muted" style="margin-top:10px">기업이 저장한 계획입니다.</p>'
        : `<div class="row"><button class="btn sm" id="savePlan">이 계획 저장</button>
        <button class="btn ghost sm" id="toTask">다시 고르기</button></div>
      <p class="muted" style="margin-top:10px">저장하시면 운영기관과 조력자가 함께 볼 수 있습니다.</p>`}
    </div>`;
}

/* 두 겹 방사형 — 회색이 지금, 브랜드색이 반영 후 */
function dualRadar(before, after){
  const B = (before||[]).filter(c => c.score != null && c.code !== 'RI');
  if(!B.length) return '';
  const A = {}; (after||[]).forEach(c => A[c.code] = c);
  const n = B.length, cx=170, cy=160, rr=112;
  const pt = (i, v) => { const a = -Math.PI/2 + i*2*Math.PI/n, rad = rr*Math.max(.08, v/100);
    return [cx + rad*Math.cos(a), cy + rad*Math.sin(a)]; };
  const web = [25,50,75,100].map(v => `<polygon points="${B.map((_,i)=>pt(i,v).join(',')).join(' ')}"
    fill="none" stroke="var(--line)" stroke-width="1"/>`).join('');
  const poly = (list, fill, stroke, dash) =>
    `<polygon points="${list.map((c,i)=>pt(i,c).join(',')).join(' ')}"
      fill="${fill}" stroke="${stroke}" stroke-width="2" ${dash?`stroke-dasharray="4 3"`:''}/>`;
  const bv = B.map(c => c.score);
  const av = B.map(c => (A[c.code] && A[c.code].score != null) ? A[c.code].score : c.score);
  const labels = B.map((c,i)=>{ const [x,y]=pt(i,122);
    return `<text x="${x}" y="${y}" font-size="10.5" fill="var(--sub)" text-anchor="middle"
      dominant-baseline="middle">${esc(c.name)}</text>`; }).join('');
  return `<svg viewBox="0 0 340 320" style="width:100%;height:auto;max-width:380px;margin:10px auto;display:block">
    ${web}
    ${poly(av, 'rgba(168,38,90,.16)', 'var(--brand)', false)}

    ${labels}</svg>
    <div class="legend"><span><i class="dash"></i>지금</span><span><i class="solid"></i>반영 후</span></div>`;
}

function paneAnswers(main, side, r){
  const v = V.view || {};
  const byId = {}; DATA.items.forEach(i => byId[i.id] = i);
  const label = (it, val) => {
    if(val === DATA.na_key) return {t:'아직까지 없었습니다', na:true};
    if(!it) return {t:esc(val)};
    if(it.method === 'SEL'){
      const n = parseInt(val, 10);
      return {t: (it.options && it.options[n-1]) ? `${n}. ${it.options[n-1]}` : String(val)};
    }
    const o = (it.options||[]).find(x => x.key === val);
    return {t: o ? `${val}. ${o.text}` : String(val)};
  };
  main.innerHTML = `<div class="card"><h3 class="h-m">문항별 응답 ${(v.answers||[]).length}건</h3>
    <p class="muted" style="margin-bottom:12px">고른 값 그대로입니다. 배점은 표시하지 않습니다.</p>
    ${(v.answers||[]).map(a => {
      const it = byId[a.item], L = label(it, a.answer);
      return `<div class="ansrow">
        <div class="id">${esc(a.item)}</div>
        <div>${esc(it ? it.text : '(문항 정보 없음)')}</div>
        <div class="pick ${L.na?'na':''}">${esc(L.t)}</div>
        <div class="num muted">${a.dwell||0}초</div></div>`;
    }).join('') || '<p class="muted">응답이 없습니다.</p>'}</div>`;
  side.innerHTML = `<div class="card"><h3 class="h-m">응답 조건</h3>
    ${Object.keys(v.cond||{}).length
      ? Object.keys(v.cond).map(k => `<div class="kv"><b>${esc(k)}</b><span>${esc(v.cond[k])}</span></div>`).join('')
      : '<p class="muted">기록 없음</p>'}
    <h3 class="h-m" style="margin-top:18px">응답 패턴 신호</h3>
    ${(r.signal_labels||[]).length
      ? (r.signal_labels||[]).map(s => `<p class="muted" style="margin:6px 0">${md(s)}</p>`).join('')
      : '<p class="muted">특이 신호 없음</p>'}</div>`;

  /* 🔴 이름·직위는 칠 때마다 저장한다. 조건 라디오가 render() 를 부르는데,
     저장 전이면 입력칸이 S.who 의 빈 값으로 다시 그려져 **친 내용이 사라졌다**.

/* ══════════════ 워크시트 — 서식 보기 · 내려받기 ══════════════
   🔴 교재가 정본이다. 여기 있는 것은 **서식 사본**이고 작성 결과는 교재 쪽에
      남기시는 편이 관리에 낫다는 안내를 함께 둔다(와이어프레임 3쪽과 같은 취지).
   🔴 내려받기는 인쇄해서 손으로 채울 수 있게 **한 장짜리 HTML** 로 만든다. */
function wsHTML(w, forFile){
  const t = w.table || {head:[], rows:[]};
  const cols = t.head.length || 2;
  const blanks = Math.max(0, 6 - (t.rows||[]).length);
  const body = (t.rows||[]).concat(Array.from({length:blanks}, () => Array(cols).fill('')));
  const style = `
    body{font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;color:#101828;
      line-height:1.6;max-width:820px;margin:32px auto;padding:0 24px}
    h1{font-size:20px;margin:0 0 4px} .sub{color:#8A93A0;font-size:13px;margin-bottom:16px}
    .lead{font-size:14px;color:#46525F;margin:10px 0 16px}
    table{width:100%;border-collapse:collapse;font-size:13.5px;margin:12px 0}
    th{background:#F6F8FB;text-align:left;padding:10px 12px;border:1px solid #D9E0E9;font-weight:600}
    td{padding:14px 12px;border:1px solid #D9E0E9;vertical-align:top;height:34px}
    .src{font-size:12px;color:#8A93A0;border-top:1px solid #E4E9F0;margin-top:18px;padding-top:10px}
    .note{background:#FCF3F7;border:1px solid #F0D6E2;border-radius:7px;padding:11px 14px;
      font-size:13px;margin:10px 0}
    @media print{body{margin:0}.noprint{display:none}}`;
  const inner = `
    <h1 class="h-l" style="margin:0 0 4px">${esc(w.ref)} 「${esc(w.title)}」</h1>
    <div class="sub muted">${esc(w.time||'')}${w.time?' · ':''}창업 교재 ${esc((w.chapter||'').replace(/^0/,'').replace(/_/g,' '))}</div>
    ${(w.lead && t.head.length) ? `<p class="lead">${esc(w.lead)}</p>` : ''}
    ${t.head.length
      ? `<table><thead><tr>${t.head.map(h=>`<th>${md(h)}</th>`).join('')}</tr></thead>
         <tbody>${body.map(r=>`<tr>${Array.from({length:cols},(_,i)=>`<td>${md(r[i]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table>`
      : (w.paras||[]).map(x=>`<p class="lead">${md(x)}</p>`).join('')}
    ${(w.notes||[]).map(n=>`<div class="note">${md(n)}</div>`).join('')}
    <div class="src">${w.source ? '출처 — ' + esc(w.source) + '<br>' : ''}
      원본은 창업 교재가 정본입니다. 이 장에는 서식만 옮겼으며,
      작성 결과는 교재 서식에 남기시는 편이 관리에 낫습니다.</div>`;
  /* 🔴 모달에는 <style> 을 넣지 않는다. 그 안의 body{max-width:820px} 가
     문서 전역에 걸려 **화면이 통째로 좁아졌다**(2026-08-01 보고).
     모달 서식은 CSS 의 `#modal ...` 규칙이 이미 맡고 있다. */
  if(!forFile) return inner;
  return `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
    <title>${esc(w.ref)} ${esc(w.title)}</title><style>${style}</style></head>
    <body>${inner}
    <div class="row noprint" style="margin-top:20px">
      <button onclick="window.print()">인쇄 · PDF로 저장</button></div></body></html>`;
}

/* ══════════════ .docx 만들기 — 라이브러리 없이 ══════════════
   서술형 워크시트(표가 아니라 글)는 CSV 로 담기지 않는다. 워드로 내려받는다.

   🔴 HTML 을 .doc 확장자로 주는 흔한 편법을 쓰지 않는다 — 워드가 형식 경고를 낸다.
      .docx 는 zip 이므로 **압축 없이(stored)** 담으면 브라우저에서 바로 만들 수 있다.
      워크시트 한 장이라 크기는 문제되지 않는다.
   ══════════════════════════════════════════════════════════ */
const CRC_T = (() => {
  const t = new Int32Array(256);
  for(let n=0;n<256;n++){ let c=n;
    for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c; }
  return t;
})();
function crc32(u8){
  let c = -1;
  for(let i=0;i<u8.length;i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ -1) >>> 0;
}

function zipStored(files){
  const enc = new TextEncoder();
  const local = [], central = [];
  let off = 0;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const d = f.data, crc = crc32(d);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);   // UTF-8 이름
    lh.setUint16(8, 0, true);                                    // 압축 없음
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true);     // 시각 자리
    lh.setUint32(14, crc, true);
    lh.setUint32(18, d.length, true); lh.setUint32(22, d.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    local.push(new Uint8Array(lh.buffer), name, d);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, d.length, true); ch.setUint32(24, d.length, true);
    ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, off, true);
    central.push(new Uint8Array(ch.buffer), name);
    off += 30 + name.length + d.length;
  });
  const cSize = central.reduce((n, p) => n + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cSize, true); end.setUint32(16, off, true);
  end.setUint16(20, 0, true);
  const all = local.concat(central, [new Uint8Array(end.buffer)]);
  const total = all.reduce((n, p) => n + p.length, 0);
  const out = new Uint8Array(total);
  let at = 0;
  all.forEach(p => { out.set(p, at); at += p.length; });
  return out;
}

function xmlEsc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
/* **굵게** 표시를 워드 런으로 옮긴다 */
function wRuns(text){
  return String(text||'').split(/(\*\*[^*]+\*\*)/).filter(Boolean).map(seg => {
    const b = /^\*\*[^*]+\*\*$/.test(seg);
    const body = b ? seg.slice(2, -2) : seg;
    return `<w:r>${b?'<w:rPr><w:b/></w:rPr>':''}`
      + `<w:t xml:space="preserve">${xmlEsc(body)}</w:t></w:r>`;
  }).join('');
}
function wPara(text, opt){
  const o = opt || {};
  const pr = `<w:pPr>${o.size?`<w:rPr><w:sz w:val="${o.size}"/></w:rPr>`:''}`
    + `<w:spacing w:after="${o.after==null?160:o.after}"/></w:pPr>`;
  return `<w:p>${pr}${text ? wRuns(text) : ''}</w:p>`;
}

function wsDocx(w){
  const body = [];
  body.push(`<w:p><w:pPr><w:spacing w:after="60"/></w:pPr>`
    + `<w:r><w:rPr><w:b/><w:sz w:val="32"/></w:rPr>`
    + `<w:t xml:space="preserve">${xmlEsc(w.ref + ' 「' + w.title + '」')}</w:t></w:r></w:p>`);
  if(w.time) body.push(wPara(`소요 ${w.time}`, {size:18}));
  body.push(wPara(''));
  (w.paras||[]).forEach(x => body.push(wPara(x)));
  (w.notes||[]).forEach(n => body.push(wPara(n)));
  body.push(wPara(''));
  body.push(wPara('작성란', {size:22}));
  for(let i=0;i<10;i++) body.push(wPara('　'));      // 손으로 채울 자리
  body.push(wPara(''));
  if(w.source) body.push(wPara(`출처 — ${w.source}`, {size:16}));
  body.push(wPara('원본은 창업 교재가 정본입니다. 이 문서에는 서식만 옮겼습니다.', {size:16}));

  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>${body.join('')}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>
<w:pgMar w:top="1418" w:right="1418" w:bottom="1418" w:left="1418"/></w:sectPr></w:body></w:document>`;

  const types = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const enc = new TextEncoder();
  return zipStored([
    {name:'[Content_Types].xml', data: enc.encode(types)},
    {name:'_rels/.rels', data: enc.encode(rels)},
    {name:'word/document.xml', data: enc.encode(doc)},
  ]);
}

/* 🔴 엑셀로 내려받는다(민부장 지시 2026-08-01).
   CSV 로 만든다 — 엑셀·구글 시트 어디서나 경고 없이 열리고, 라이브러리도 필요 없다.
   **UTF-8 BOM 을 반드시 넣는다.** 없으면 엑셀이 한글을 깨뜨린다. */
function csvCell(v){
  const s = String(v == null ? '' : v).replace(/\*\*/g, '');   // 굵게 표시는 뺀다
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function saveBlob(blob, name){
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return true;
  }catch(e){ return false; }
}

function wsDownload(ref){
  const w = (DATA.worksheets||{})[ref];
  if(!w) return;
  const t = w.table || {head:[], rows:[]};

  /* 🔴 표가 없는 서술형 실습은 워드로 준다(민부장 지시 2026-08-01).
     CSV 로는 글이 한 칸에 뭉개진다. */
  if(!t.head.length){
    const name = `${ref.replace(/\s/g,'')}_${w.title.replace(/[\\/:*?"<>|]/g,'')}.docx`;
    const okd = saveBlob(new Blob([wsDocx(w)],
      {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}), name);
    if(!okd) alert('내려받지 못했습니다. 「서식 보기」에서 인쇄를 이용해 주십시오.');
    return;
  }
  const cols = t.head.length || 2;
  const blanks = Math.max(0, 8 - (t.rows||[]).length);   // 손으로 채울 자리를 넉넉히
  const lines = [];
  lines.push([`${w.ref} 「${w.title}」`].map(csvCell).join(','));
  if(w.time) lines.push([`소요 ${w.time}`].map(csvCell).join(','));
  if(w.lead) lines.push([w.lead].map(csvCell).join(','));
  lines.push('');
  if(!t.head.length){ (w.paras||[]).forEach(x => lines.push([x].map(csvCell).join(','))); }
  lines.push(t.head.map(csvCell).join(','));
  (t.rows||[]).forEach(r =>
    lines.push(Array.from({length:cols}, (_, i) => csvCell(r[i] || '')).join(',')));
  for(let i = 0; i < blanks; i++)
    lines.push(Array.from({length:cols}, () => '').join(','));
  lines.push('');
  (w.notes||[]).forEach(n => lines.push([n].map(csvCell).join(',')));
  if(w.source) lines.push([`출처 — ${w.source}`].map(csvCell).join(','));
  lines.push(['원본은 창업 교재가 정본입니다. 이 파일에는 서식만 옮겼습니다.']
    .map(csvCell).join(','));

  const okc = saveBlob(new Blob(['﻿' + lines.join('\r\n')],
    {type:'text/csv;charset=utf-8'}),
    `${ref.replace(/\s/g,'')}_${w.title.replace(/[\\/:*?"<>|]/g,'')}.csv`);
  if(!okc) alert('내려받지 못했습니다. 「서식 보기」에서 인쇄를 이용해 주십시오.');
}

function doSavePlan(){
  const r = RES(); if(!r) return;
  const picks = {}, labels = {};
  if(isAdmin()){ alert('관리자는 기업의 계획을 고치지 않습니다.'); return; }
  Object.keys(S.plan).forEach(id => {
    if(S.plan[id] === null || S.plan[id] === undefined) return;
    picks[id] = S.plan[id];
  });
  /* 라벨도 함께 남긴다 — 나중에 처방 문구를 고쳐도 그때 무엇을 고르셨는지 남는다 */
  (r.prescriptions||[]).forEach(p => (p.items||[]).forEach(i => {
    if(picks[i.id] === undefined) return;
    labels[i.id] = (i.checks||[])[picks[i.id]] || '';
  }));
  busy(true, '계획을 저장하는 중입니다…');
  api('savePlan', {token:S.token, run:(r.meta||{}).run||0, picks, labels}).then(x => {
    busy(false);
    alert(x && x.ok ? `${x.saved}건을 저장했습니다.`
      : '저장하지 못했습니다.\n' + apiErrText(x && x.error));
  }).catch(() => { busy(false); alert('서버에 닿지 못했습니다.'); });
}

function doUnlock(cid){
  if(!confirm(`${cid} 의 로그인 잠금을 해제합니다.\n\n계속하시겠습니까?`)) return;
  busy(true, '잠금을 해제하는 중입니다…');
  api('unlock', {token: S.token, cid}).then(r => {
    busy(false);
    if(!r || !r.ok){ alert('해제하지 못했습니다.\n' + apiErrText(r && r.error)); return; }
    V.list = null; render();
  }).catch(() => { busy(false); alert('서버에 닿지 못했습니다.'); });
}

/* 재진단 — 막지 않는다. 30일 이내면 한 번 알린다.
   문항이 최근 3개월 행동을 묻기 때문에 짧은 간격으로는 답이 거의 같게 나온다. */
function startNew(){
  const d = V.myRuns && V.myRuns.days_since_last;
  if(d != null && d < 30 && !confirm(
      `직전 진단이 ${d}일 전입니다.\n`
      + `문항이 최근 3개월 동안의 행동을 묻기 때문에 답이 크게 달라지지 않을 수 있습니다.\n\n`
      + `그래도 새로 시작하시겠습니까?`)) return;
  S.ans = {}; S.dwell = {}; S.page = 0; S.result = null;
  S.consent = {c1:0,c2:0,c3:0,c4:0}; S.cond = {}; S.started = Date.now();
  save(); go('intro');
}

function doLogin(){
  const cid = ($('#fCid').value||'').trim(), code = ($('#fCode').value||'').trim();
  const err = $('#loginErr');
  const fail = t => { err.textContent = t; err.classList.remove('hide'); };
  if(!cid || !code) return fail('아이디와 접속 코드를 모두 입력해 주십시오.');
  err.classList.add('hide');

  if(LOCAL){ S.cid = cid; S.role = 'company'; S.token = 'local';
    S.company = '(로컬 검수)'; S.started = Date.now(); save(); return go('home'); }

  const btn = $('#doLogin'), label = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = '접속 중입니다…'; }
  const done = () => { busy(false); if(btn){ btn.disabled = false; btn.textContent = label; } };
  busy(true, '접속 중입니다…');

  api('login', {cid, code}).then(r => {
    done();
    if(!r || !r.ok){
      if(r && r.error === 'locked')
        return fail(`${LOGIN_MAX}회 잘못 입력하여 잠겼습니다. `
          + `약 ${r.hours || 24}시간 뒤 다시 시도하실 수 있습니다. `
          + `급하시면 운영기관으로 문의해 주십시오.`);
      if(r && r.error === 'revoked')
        return fail('사용할 수 없는 계정입니다. 운영기관으로 문의해 주십시오.');
      const left = r && typeof r.left === 'number' ? r.left : null;
      return fail('아이디 또는 접속 코드가 맞지 않습니다.'
        + (left != null ? ` (남은 시도 ${left}회)` : ''));
    }
    /* 🔴 역할이 바뀌면 이전 응답을 비운다 — 관리자가 쓰던 브라우저에 기업 응답이
       남아 있거나 그 반대인 상태를 막는다. */
    if(S.role && S.role !== r.role){ S.ans = {}; S.dwell = {}; S.page = 0; S.result = null; }
    S.token = r.token; S.role = r.role; S.cid = r.cid || cid;
    S.company = r.company || ''; S.started = Date.now();
    V.list = null; V.myRuns = null; V.view = null; V.open = '';
    save();
    go(r.role === 'admin' ? 'admin' : 'home');
  }).catch(() => { done();
    fail('서버에 닿지 못했습니다. 잠시 후 다시 시도해 주십시오.'); });
}

function toSurvey(){
  S.who.name = ($('#wName').value||'').trim();
  S.who.title = ($('#wTitle').value||'').trim();
  save();
  const missing = [];
  if(!S.who.name) missing.push('이름');
  if(!S.who.title) missing.push('직위');
  DATA.conditions.forEach(c => { if(!S.cond[c.id]) missing.push(c.title); });
  const msg = $('#wMsg');
  if(missing.length){ msg.textContent = missing.join(' · ') + ' 항목을 채워 주십시오.'; return; }
  S.page = 0; S.started = Date.now(); save(); go('survey');
}

function nextPage(){
  const miss = pageItems(S.page).filter(i => S.ans[i.id] === undefined || S.ans[i.id] === '');
  if(miss.length){
    const msg = $('#sMsg');
    msg.innerHTML = `<a href="#" id="jump">${miss.length}문항이 남았습니다 — 첫 문항으로</a>`;
    const j = $('#jump');
    if(j) j.addEventListener('click', e => { e.preventDefault();
      const el = document.querySelector(`[data-q="${miss[0].id}"]`);
      if(el){ el.scrollIntoView({behavior:'smooth', block:'center'});
        el.style.outline = '2px solid var(--brand)'; el.style.outlineOffset = '8px';
        setTimeout(()=>{ el.style.outline=''; }, 1600); } });
    return;
  }
  if(S.page < PAGES-1){ S.page++; save(); render(); window.scrollTo(0,0); return; }
  go('scoring');
}

/* ── 제출·채점 ── */

  }).then(r => {

/* 🔴 서버 코드를 고치고 **재배포를 안 하면** 새 기능이 unknown_action 으로 돌아온다.
   「계산에 실패했습니다」로만 보이면 원인을 못 찾는다(2026-08-01 실제로 헤맸다). */
function apiErrText(err){
  if(err === 'unknown_action')
    return '서버가 아직 갱신되지 않았습니다. 운영기관에 재배포를 요청해 주십시오.';
  if(err === 'unauthorized') return '접속이 만료되었습니다. 다시 로그인해 주십시오.';
  if(err === 'notfound') return '해당 회차를 찾지 못했습니다.';
  if(err === 'noanswers') return '이 회차에 저장된 응답이 없습니다.';
  return err ? '오류 — ' + err : '';
}

function api(action, payload){
  const url = DATA.meta.gas_url;
  if(!url || url.indexOf('__GAS_URL__') >= 0)
    return Promise.reject(new Error('GAS 주소 미주입'));
  return fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action}, payload))}).then(r => r.json());
}

/* ── 결과 탭 ── */
function tab(name){
  document.querySelectorAll('.tab[data-tab]').forEach(t =>
    t.classList.toggle('on', t.dataset.tab === name));
  const r = RES(), main = $('#paneMain'), side = $('#paneSide');
  S.tab = name; save();
  if(!r || !main) return;
  if(name === 'plan') panePlan(main, side, r);
  else if(name === 'answers') paneAnswers(main, side, r);
  else if(name === 'task') paneTask(main, side, r);
  else if(name === 'notes') paneNotes(main, side, r);
  else if(name === 'metric') paneMetric(main, side, r);
  else paneNext(main, side, r);
  bindPane();                 // 🔴 반드시 pane 을 그린 뒤에
}

/* 🔴 pane 안쪽 요소는 bind() 시점에 아직 없다.
   render() → bind() → tab() 순서라 #paneMain 이 비어 있을 때 bind() 가 돈다.
   그래서 대응 라디오에 리스너가 하나도 안 걸렸고, 눌러도 저장되지 않았다
   (2026-08-01 보고). pane 을 그릴 때마다 여기서 다시 건다. */
function bindPane(){
  const on = (sel, fn) => { const e = $(sel); if(e) e.addEventListener('click', fn); };

  document.querySelectorAll('.planpick').forEach(el =>
    el.addEventListener('change', () => {
      const id = el.dataset.item, v = el.dataset.idx;
      S.plan[id] = (v === 'none') ? null : Number(v);
      save();
      V.sim = null; V.simFor = '';            // 선택이 바뀌면 산술을 다시 한다
      tab('task');
    }));
  on('#toTask', () => tab('task'));
  on('#savePlan', doSavePlan);
  on('#dlPdf', downloadPdf);
  document.querySelectorAll('.wsOpen').forEach(el =>
    el.addEventListener('click', () => wsOpen(el.dataset.ref)));
  document.querySelectorAll('.wsDown').forEach(el =>
    el.addEventListener('click', () => wsDownload(el.dataset.ref)));
}

/* 🔴 영역을 골라서 본다(2026-08-01). 전에는 9영역 처방을 한 줄로 쭉 이어 붙여
   페이지가 한없이 길어졌다. 지금은 왼쪽 목록에서 고른 영역만 그린다. */
function paneTask(main, side, r){
  const all = r.prescriptions || [];
  const cs = r.scores.competencies || [];
  const has = c => all.some(p => p.competency === c);

  if(!all.length){ main.innerHTML = `<div class="card"><h3 class="h-m">지금 구간에서 먼저 손댈 자리가 없습니다</h3>
    <p class="lead">보완 구간에 든 영역이 없습니다. 지금 수준을 유지하시면서 재진단으로 변화를 확인해 보시기 바랍니다.</p></div>`;
    side.innerHTML = ''; return; }

  /* 고른 것이 없거나 그 영역에 처방이 없으면 처방이 있는 첫 영역으로 간다 */
  if(!S.comp || !has(S.comp)){ S.comp = all[0].competency; save(); }
  const sel = cs.find(c => c.code === S.comp);
  const list = all.filter(p => p.competency === S.comp);

  if(!list.length){
    main.innerHTML = `<div class="card">
      <h3 class="h-m">${esc(sel ? sel.name : S.comp)}</h3>
      <span class="pill ${sel && sel.band==='강점'?'p-g':'p-m'}">${esc(sel ? sel.band : '')}</span>
      <p class="lead" style="margin-top:10px">이 영역은 보완 구간이 아니어서 과제가 없습니다.
        왼쪽 목록에서 <b style="color:var(--warn)">보완</b> 표시가 붙은 영역을 눌러 보십시오.</p></div>`;
    side.innerHTML = ''; return;
  }

  const items = list.flatMap(p => p.items || []);
  const PL = planNow(), ro = planRO();
  const done = items.filter(i => PL[i.id] !== undefined && PL[i.id] !== null).length;

  main.innerHTML = `
    ${ro ? `<div class="card">
      <div class="kv"><b>열람</b><span>기업이 고른 대응입니다. 여기서는 고칠 수 없습니다.</span></div>
      <p class="muted" style="margin-top:8px">${done ? `${done}건을 고르셨습니다.`
        : '아직 고른 대응이 없습니다. 기업이 결과 화면에서 고르고 저장하면 여기에 나옵니다.'}</p>
    </div>` : `<div class="card brand">
      <div class="kv"><b>고르는 법</b><span>문항마다 <b style="color:var(--ink)">하나만</b> 고르십시오.
        지금 손댈 것이 아니면 「지금은 아님」을 고르시면 됩니다.</span></div>
      <p class="muted" style="margin-top:8px">세 가지 중 무엇을 고르시든 산술은 같습니다 —
        문항 하나가 한 단계 오르는 것으로 봅니다.
        <b style="color:var(--ink)">무엇을 고르실지는 실행 가능성으로 정하십시오.</b></p>
      <p class="muted">이미 하고 계신 것이라면 고르실 이유가 없습니다.</p>
    </div>`}` + list.map(p => `
    <div class="card">
      <div style="display:flex;gap:8px;align-items:center">
        <h3 class="h-m" style="margin:0">${esc(p.competency_name || p.competency)}</h3>
        <span class="pill p-w">${esc(p.band)}</span>
        <span class="sp" style="flex:1"></span>
        <span class="muted">고르신 대응 ${done}/${items.length}</span></div>
      <p class="lead" style="margin-top:8px">${md(p.why || '')}</p>

function loadOnce(src){
  return new Promise((ok, no) => {
    if(document.querySelector(`script[data-src="${src}"]`)) return ok();
    const s = document.createElement('script');
    s.src = src; s.dataset.src = src; s.onload = () => ok(); s.onerror = () => no(new Error(src));
    document.head.appendChild(s);
  });
}

  return `<style>${PDF_CSS}</style>`
    + pages.map((p, i) => p.replace('__FOOT__', pgFoot(i + 1, total)))
        .join('<div class="pdf-pb"></div>');
}

async function downloadPdf(){
  const btn = $('#dlPdf'); const old = btn ? btn.textContent : '';
  let host = null;
  try{
    if(btn) btn.textContent = '준비 중…';
    busy(true, '보고서를 만드는 중입니다…');
    await loadOnce(CDN.h2c); await loadOnce(CDN.jspdf);

    /* 🔴 화면을 캡처하지 않는다. 7쪽 정식 서식을 따로 조립해 캡처한다.
       화면 밖 host(fixed·opacity 0) 안에 **static 자식**으로 넣어야 높이가 0이 되지 않는다
       (플레이북 패턴_클라이언트PDF_섹션보고서생성). */
    host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:0;top:0;opacity:0;pointer-events:none;z-index:-1';
    const area = document.createElement('div');
    area.id = 'pdfArea';
    area.innerHTML = reportHTML(RES());
    host.appendChild(area);
    document.body.appendChild(host);
    await new Promise(res => setTimeout(res, 260));   // 폰트·레이아웃 안정

    const secs = Array.from(area.querySelectorAll('.pg'));
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'mm', format:'a4', orientation:'p'});
    const W = 210, H = 297, M = 10, availW = W - M*2, availH = H - M*2;
    let first = true;
    for(const el of secs){
      /* 🔴 PNG·scale2 로 담았더니 450MB 가 나왔다(2026-08-01).
         쪽 높이를 고정한 데 더해 JPEG·배율 1.6 으로 낮춘다. */
      const cv = await html2canvas(el, {scale:1.6, backgroundColor:'#ffffff',
        width: 794, windowWidth: 794, scrollX:0, scrollY:0});
      const imgH = availW * cv.height / cv.width;
      let y = 0;
      while(y < imgH - 0.5){
        if(!first) pdf.addPage();
        first = false;
        const sliceH = Math.min(availH, imgH - y);
        const part = document.createElement('canvas');
        part.width = cv.width;
        part.height = Math.round(cv.height * (sliceH / imgH));
        part.getContext('2d').drawImage(cv, 0, Math.round(cv.height * (y / imgH)),
          cv.width, part.height, 0, 0, cv.width, part.height);
        pdf.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', M, M, availW, sliceH);
        y += sliceH;
      }
    }
    const m = (RES() && RES().meta) || {};
    pdf.save(`FIA_결과보고서_${m.cid||'result'}_R${m.run||1}.pdf`);
  }catch(e){
    alert('PDF를 만들지 못했습니다. 인터넷 연결을 확인해 주십시오.');
  }finally{
    busy(false);
    if(host && host.parentNode) host.parentNode.removeChild(host);   // 🔴 반드시 걷어낸다
    if(btn) btn.textContent = old || 'PDF 내려받기';
  }
}

      저장하면 처방 문구를 고쳐도 옛 사본이 남는다. */
if(!S.token && S.screen !== 'landing' && S.screen !== 'login') S.screen = 'landing';
if(S.token && S.screen === 'result') S.screen = isAdmin() ? 'admin' : 'home';
if(S.token && (S.screen === 'landing' || S.screen === 'login'))
  S.screen = isAdmin() ? 'admin' : 'home';
render();
</script>
